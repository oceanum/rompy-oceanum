[version]
current = "0.1.6"
regex = "^(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)$"

[git]
message_template = "Bump version to {new_version}"
tag_template = "v{new_version}"

[[file]]
src = "rompy_oceanum/__init__.py"
search = '__version__ = "{current_version}"'

[[file]]
src = "cloudbuild.yaml"
search = 'rompy:v"{current_version}"'
