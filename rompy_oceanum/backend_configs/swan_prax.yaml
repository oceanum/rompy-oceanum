# Backend configuration for SWAN model execution within Prax pipeline containers
# This configuration defines local backend execution for use when already running inside Docker

backend:
  type: local
  timeout: 3600
  command: "mpirun -n 2 /usr/local/bin/swan.exe"
  shell: true
  capture_output: true
  working_dir: "/app"
  env_vars:
    OMPI_ALLOW_RUN_AS_ROOT: "1"
    OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
    OMP_NUM_THREADS: "2"
    ROMPY_MODEL: "swan"

postprocess:
  processor: datamesh
  config:
    output_patterns:
      - "*.nc"
      - "*.dat"
      - "*.csv"
      - "*.log"
      - "*.tab"
    tags:
      - "swan"
      - "wave-model"
      - "oceanum"
      - "prax-pipeline"
      - "rompy-generated"
    metadata:
      model_type: "swan"
      backend_type: "local"
      execution_environment: "prax"
      generated_by: "rompy-oceanum"
      framework: "rompy"
