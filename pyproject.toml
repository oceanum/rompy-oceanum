[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rompy-oceanum"
version = "0.1.0"
authors = [{ name = "rompy-oceanum contributors" }]
description = "Oceanum Prax pipeline integration for rompy"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "rompy[swan,schism]>=0.5.1",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.25.0",
    "tenacity>=9.0.0",
    "typer>=0.15.0",
    "shellingham>=1.5.0",
    "rich>=10.11.0",
    "oceanum",
    "oceanum-prax",
]

[tool.setuptools]
packages = ["rompy_oceanum"]
include-package-data = true

[tool.setuptools.package-data]
"rompy_oceanum" = ["pipeline_templates/*.yaml"]


[project.urls]
Homepage = "https://github.com/rom-py/rompy"
"Bug Tracker" = "https://github.com/rom-py/rompy/issues"

[project.entry-points."rompy.pipeline"]
prax = "rompy_oceanum.pipeline:PraxPipelineBackend"

[project.entry-points."rompy.postprocess"]
datamesh = "rompy_oceanum.postprocess:DataMeshPostprocessor"


[project.scripts]
datamesh = "rompy_oceanum.datamesh:main"
rompy-oceanum = "rompy_oceanum.cli:main"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=rompy_oceanum --cov-report=term-missing"

[project.optional-dependencies]
dev = ["pytest>=6.0.0", "pytest-cov>=2.12.0", "pytest-mock>=3.6.0"]
