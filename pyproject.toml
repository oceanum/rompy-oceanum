[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rompy-oceanum"
version = "0.1.0"
authors = [
  { name = "rompy-oceanum contributors" }
]
description = "Oceanum Prax pipeline integration for rompy"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    "rompy>=0.2.3",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.25.0"
]

[project.urls]
Homepage = "https://github.com/rom-py/rompy"
"Bug Tracker" = "https://github.com/rom-py/rompy/issues"

[project.entry-points."rompy.extensions"]
oceanum = "rompy_oceanum:extension"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=rompy_oceanum --cov-report=term-missing"

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
    "pytest-mock>=3.6.0"
]
