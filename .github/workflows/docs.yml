name: Build and Deploy Documentation

# Automatically build and deploy documentation to GitHub Pages
# - On push to main/master: Build and deploy to GitHub Pages
# - On pull requests: Build and test documentation for validation
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for proper version detection

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-docs-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-docs-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install rompy-oceanum with documentation dependencies
          pip install -e ".[docs]"
          # Verify oceanum CLI integration works
          oceanum --version || echo "oceanum CLI not available"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

      - name: Build documentation
        run: |
          cd docs
          make clean
          # Build with verbose output and strict warnings
          make html SPHINXOPTS="-W --keep-going"
          echo "✅ Documentation built successfully"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          path: ./docs/build/html

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Test job for PRs
  test-docs:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install rompy-oceanum with documentation dependencies
          pip install -e ".[docs]"
          # Verify oceanum CLI integration works
          oceanum --version || echo "oceanum CLI not available"

      - name: Test documentation build
        run: |
          cd docs
          make clean
          # Build with strict warnings (any warning will fail the build)
          make html SPHINXOPTS="-W"
          echo "✅ Documentation builds successfully without warnings"

      - name: Check for warnings and validate links
        run: |
          cd docs
          # Count warnings in build output
          echo "🔍 Checking for documentation warnings..."
          warning_count=$(make html 2>&1 | grep -c "WARNING" || echo "0")
          if [ "$warning_count" -gt 0 ]; then
            echo "❌ Found $warning_count warning(s) in documentation build"
            echo "Warnings found:"
            make html 2>&1 | grep "WARNING" || true
            exit 1
          else
            echo "✅ No warnings found in documentation build"
          fi

          # Validate that key files exist
          echo "🔍 Validating documentation structure..."
          if [ ! -f "build/html/index.html" ]; then
            echo "❌ Main index.html not found"
            exit 1
          fi

          if [ ! -f "build/html/user-guide/index.html" ]; then
            echo "❌ User guide index not found"
            exit 1
          fi

          echo "✅ Documentation structure validation passed"
