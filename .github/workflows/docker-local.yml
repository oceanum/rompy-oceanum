name: Local Docker Development

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Which image to build'
        required: true
        default: 'both'
        type: choice
        options:
          - 'swan'
          - 'rompy'
          - 'both'
      tag:
        description: 'Custom tag for the images'
        required: false
        default: 'dev'
        type: string

jobs:
  build-local:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build SWAN image
        if: github.event.inputs.image == 'swan' || github.event.inputs.image == 'both'
        run: |
          echo "🔨 Building SWAN image with tag: ${{ github.event.inputs.tag }}"
          docker build \
            -t rompy-oceanum/swan:${{ github.event.inputs.tag }} \
            -f docker/swan.Dockerfile \
            .

          echo "✅ SWAN image built successfully"
          docker images rompy-oceanum/swan:${{ github.event.inputs.tag }}

      - name: Build Rompy image
        if: github.event.inputs.image == 'rompy' || github.event.inputs.image == 'both'
        run: |
          echo "🔨 Building Rompy image with tag: ${{ github.event.inputs.tag }}"
          docker build \
            -t rompy-oceanum/rompy:${{ github.event.inputs.tag }} \
            -f docker/rompy.Dockerfile \
            .

          echo "✅ Rompy image built successfully"
          docker images rompy-oceanum/rompy:${{ github.event.inputs.tag }}

      - name: Test SWAN image
        if: github.event.inputs.image == 'swan' || github.event.inputs.image == 'both'
        run: |
          echo "🧪 Testing SWAN image..."

          # Basic functionality test
          docker run --rm rompy-oceanum/swan:${{ github.event.inputs.tag }} swan.exe --help || echo "SWAN help completed"

          # Check that required tools are available
          docker run --rm rompy-oceanum/swan:${{ github.event.inputs.tag }} which swan.exe
          docker run --rm rompy-oceanum/swan:${{ github.event.inputs.tag }} mpirun --version

          echo "✅ SWAN image tests passed"

      - name: Test Rompy image
        if: github.event.inputs.image == 'rompy' || github.event.inputs.image == 'both'
        run: |
          echo "🧪 Testing Rompy image..."

          # Test Python environment and packages
          docker run --rm rompy-oceanum/rompy:${{ github.event.inputs.tag }} python -c "
          import rompy
          import rompy_oceanum
          import oceanum
          print('✅ All packages imported successfully')
          print(f'Rompy version: {rompy.__version__}')
          "

          # Test CLI
          docker run --rm rompy-oceanum/rompy:${{ github.event.inputs.tag }} rompy-oceanum --help

          echo "✅ Rompy image tests passed"

      - name: Save images as artifacts
        run: |
          echo "📦 Saving images as artifacts..."

          if [ "${{ github.event.inputs.image }}" = "swan" ] || [ "${{ github.event.inputs.image }}" = "both" ]; then
            docker save rompy-oceanum/swan:${{ github.event.inputs.tag }} | gzip > swan-${{ github.event.inputs.tag }}.tar.gz
          fi

          if [ "${{ github.event.inputs.image }}" = "rompy" ] || [ "${{ github.event.inputs.image }}" = "both" ]; then
            docker save rompy-oceanum/rompy:${{ github.event.inputs.tag }} | gzip > rompy-${{ github.event.inputs.tag }}.tar.gz
          fi

          ls -lh *.tar.gz || echo "No tar files created"

      - name: Upload SWAN image artifact
        if: github.event.inputs.image == 'swan' || github.event.inputs.image == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: swan-image-${{ github.event.inputs.tag }}
          path: swan-${{ github.event.inputs.tag }}.tar.gz
          retention-days: 7

      - name: Upload Rompy image artifact
        if: github.event.inputs.image == 'rompy' || github.event.inputs.image == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: rompy-image-${{ github.event.inputs.tag }}
          path: rompy-${{ github.event.inputs.tag }}.tar.gz
          retention-days: 7

      - name: Build summary
        run: |
          echo "## Local Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- Image(s): ${{ github.event.inputs.image }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: ${{ github.event.inputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event.inputs.image }}" = "swan" ] || [ "${{ github.event.inputs.image }}" = "both" ]; then
            echo "✅ **SWAN image built successfully**" >> $GITHUB_STEP_SUMMARY
            echo "- Image: \`rompy-oceanum/swan:${{ github.event.inputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ github.event.inputs.image }}" = "rompy" ] || [ "${{ github.event.inputs.image }}" = "both" ]; then
            echo "✅ **Rompy image built successfully**" >> $GITHUB_STEP_SUMMARY
            echo "- Image: \`rompy-oceanum/rompy:${{ github.event.inputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Usage:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the artifacts from this workflow run" >> $GITHUB_STEP_SUMMARY
          echo "2. Load the images locally:" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.image }}" = "swan" ] || [ "${{ github.event.inputs.image }}" = "both" ]; then
            echo "   docker load < swan-${{ github.event.inputs.tag }}.tar.gz" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ github.event.inputs.image }}" = "rompy" ] || [ "${{ github.event.inputs.image }}" = "both" ]; then
            echo "   docker load < rompy-${{ github.event.inputs.tag }}.tar.gz" >> $GITHUB_STEP_SUMMARY
          fi
          echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Run the containers as needed for development" >> $GITHUB_STEP_SUMMARY
