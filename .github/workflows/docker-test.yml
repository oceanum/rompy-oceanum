name: Docker Development and Testing

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'docker/**'
      - 'rompy_oceanum/**'
      - 'tests/**'
      - 'pyproject.toml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'docker/**'
      - 'rompy_oceanum/**'
      - 'tests/**'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  # Quick Docker lint and validation
  docker-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lint SWAN Dockerfile
        run: |
          echo "🔍 Linting SWAN Dockerfile..."
          docker run --rm -i hadolint/hadolint < docker/swan.Dockerfile || echo "SWAN Dockerfile has linting issues"

      - name: Lint Rompy Dockerfile
        run: |
          echo "🔍 Linting Rompy Dockerfile..."
          docker run --rm -i hadolint/hadolint < docker/rompy.Dockerfile || echo "Rompy Dockerfile has linting issues"

      - name: Check Dockerfile syntax
        run: |
          echo "🔍 Checking Dockerfile syntax..."
          docker build --no-cache --dry-run -f docker/swan.Dockerfile .
          docker build --no-cache --dry-run -f docker/rompy.Dockerfile .
          echo "✅ All Dockerfiles have valid syntax"

  # Fast build test (single platform)
  quick-build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile:
          - name: "swan"
            file: "docker/swan.Dockerfile"
            test_command: "swan.exe --help"
          - name: "rompy"
            file: "docker/rompy.Dockerfile"
            test_command: "python -c 'import rompy_oceanum; print(\"OK\")'"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.dockerfile.name }} image
        run: |
          echo "🔨 Building ${{ matrix.dockerfile.name }} image..."
          docker build -t test-${{ matrix.dockerfile.name }}:latest -f ${{ matrix.dockerfile.file }} .

      - name: Test ${{ matrix.dockerfile.name }} image
        run: |
          echo "🧪 Testing ${{ matrix.dockerfile.name }} image..."

          # Basic container health check
          docker run --rm test-${{ matrix.dockerfile.name }}:latest echo "Container starts successfully"

          # Run specific test command
          docker run --rm test-${{ matrix.dockerfile.name }}:latest ${{ matrix.dockerfile.test_command }} || echo "Test command completed"

          echo "✅ ${{ matrix.dockerfile.name }} image test passed"

  # Integration testing with both images
  integration-test:
    runs-on: ubuntu-latest
    needs: quick-build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build both images
        run: |
          echo "🔨 Building both images for integration testing..."
          docker build -t test-swan:latest -f docker/swan.Dockerfile .
          docker build -t test-rompy:latest -f docker/rompy.Dockerfile .

      - name: Test SWAN image functionality
        run: |
          echo "🧪 Testing SWAN image functionality..."

          # Test SWAN executable
          docker run --rm test-swan:latest which swan.exe

          # Test MPI functionality
          docker run --rm test-swan:latest mpirun --version

          # Test NetCDF support
          docker run --rm test-swan:latest which nc-config || echo "NetCDF tools check completed"

          # Test that SWAN can show help
          docker run --rm test-swan:latest swan.exe -help || echo "SWAN help completed"

          echo "✅ SWAN functionality tests passed"

      - name: Test Rompy image functionality
        run: |
          echo "🧪 Testing Rompy image functionality..."

          # Test Python environment
          docker run --rm test-rompy:latest python --version

          # Test core dependencies
          docker run --rm test-rompy:latest python -c "
          import sys
          print(f'Python: {sys.version}')

          import rompy
          print(f'Rompy: {rompy.__version__}')

          import pydantic
          print(f'Pydantic: {pydantic.__version__}')

          import requests
          print(f'Requests: {requests.__version__}')

          import oceanum
          print('Oceanum: imported successfully')
          "

          # Test rompy-oceanum plugin
          docker run --rm test-rompy:latest python -c "
          from rompy_oceanum.pipeline import PraxPipelineBackend
          print('✅ PraxPipelineBackend imported successfully')

          from rompy_oceanum.config import PraxConfig
          print('✅ PraxConfig imported successfully')
          "

          # Test CLI tools
          docker run --rm test-rompy:latest rompy-oceanum --version || echo "CLI version check completed"

          echo "✅ Rompy functionality tests passed"

      - name: Test plugin integration
        run: |
          echo "🧪 Testing plugin integration..."

          # Test that rompy can discover the plugin
          docker run --rm test-rompy:latest python -c "
          import pkg_resources

          # Check pipeline plugin
          pipeline_plugins = list(pkg_resources.iter_entry_points('rompy.pipeline'))
          prax_plugin = [p for p in pipeline_plugins if p.name == 'prax']

          if prax_plugin:
              print('✅ Prax pipeline plugin discovered')
              plugin = prax_plugin[0].load()
              print(f'✅ Prax pipeline plugin loaded: {plugin}')
          else:
              print('❌ Prax pipeline plugin not found')
              raise Exception('Plugin not found')

          # Check postprocess plugin
          postprocess_plugins = list(pkg_resources.iter_entry_points('rompy.postprocess'))
          datamesh_plugin = [p for p in postprocess_plugins if p.name == 'datamesh']

          if datamesh_plugin:
              print('✅ DataMesh postprocess plugin discovered')
          else:
              print('❌ DataMesh postprocess plugin not found')
          "

          echo "✅ Plugin integration tests passed"

  # Performance and size analysis
  image-analysis:
    runs-on: ubuntu-latest
    needs: quick-build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images for analysis
        run: |
          docker build -t analysis-swan:latest -f docker/swan.Dockerfile .
          docker build -t analysis-rompy:latest -f docker/rompy.Dockerfile .

      - name: Analyze image sizes
        run: |
          echo "## Docker Image Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Image Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|" >> $GITHUB_STEP_SUMMARY

          swan_size=$(docker images analysis-swan:latest --format "{{.Size}}")
          rompy_size=$(docker images analysis-rompy:latest --format "{{.Size}}")

          echo "| SWAN | $swan_size |" >> $GITHUB_STEP_SUMMARY
          echo "| Rompy | $rompy_size |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Layer Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "**SWAN layers:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker history analysis-swan:latest --format "table {{.Size}}\t{{.CreatedBy}}" --no-trunc | head -20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Rompy layers:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker history analysis-rompy:latest --format "table {{.Size}}\t{{.CreatedBy}}" --no-trunc | head -20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check for vulnerabilities
        run: |
          echo "🔍 Scanning for vulnerabilities..."

          # Install trivy
          sudo apt-get update
          sudo apt-get install wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy

          # Scan images
          echo "Scanning SWAN image..."
          trivy image --exit-code 0 --severity HIGH,CRITICAL analysis-swan:latest || echo "SWAN vulnerabilities found"

          echo "Scanning Rompy image..."
          trivy image --exit-code 0 --severity HIGH,CRITICAL analysis-rompy:latest || echo "Rompy vulnerabilities found"

          echo "✅ Vulnerability scan completed"

  # Test summary
  test-summary:
    runs-on: ubuntu-latest
    needs: [docker-lint, quick-build-test, integration-test, image-analysis]
    if: always()
    steps:
      - name: Test Summary
        run: |
          echo "## Docker Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Lint results
          if [ "${{ needs.docker-lint.result }}" = "success" ]; then
            echo "✅ Docker Lint: **Passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Docker Lint: **Failed**" >> $GITHUB_STEP_SUMMARY
          fi

          # Build tests
          if [ "${{ needs.quick-build-test.result }}" = "success" ]; then
            echo "✅ Quick Build Test: **Passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Quick Build Test: **Failed**" >> $GITHUB_STEP_SUMMARY
          fi

          # Integration tests
          if [ "${{ needs.integration-test.result }}" = "success" ]; then
            echo "✅ Integration Test: **Passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Integration Test: **Failed**" >> $GITHUB_STEP_SUMMARY
          fi

          # Image analysis
          if [ "${{ needs.image-analysis.result }}" = "success" ]; then
            echo "✅ Image Analysis: **Completed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Image Analysis: **Failed**" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "- Review test results above" >> $GITHUB_STEP_SUMMARY
            echo "- If all tests pass, the PR is ready for Docker builds" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Docker images will be built and pushed by the main build workflow" >> $GITHUB_STEP_SUMMARY
          fi
