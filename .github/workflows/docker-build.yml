name: Build and Push Docker Images

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'docker/**'
      - 'rompy_oceanum/**'
      - 'pyproject.toml'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'docker/**'
      - 'rompy_oceanum/**'
      - 'pyproject.toml'
      - '.github/workflows/docker-build.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_swan:
        description: 'Build SWAN Docker image'
        required: false
        default: 'true'
        type: boolean
      build_rompy:
        description: 'Build Rompy Docker image'
        required: false
        default: 'true'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job to determine which images to build
  determine-builds:
    runs-on: ubuntu-latest
    outputs:
      build_swan: ${{ steps.changes.outputs.swan || github.event.inputs.build_swan || 'true' }}
      build_rompy: ${{ steps.changes.outputs.rompy || github.event.inputs.build_rompy || 'true' }}
      swan_changed: ${{ steps.changes.outputs.swan }}
      rompy_changed: ${{ steps.changes.outputs.rompy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        id: changes
        run: |
          # For workflow_dispatch, use inputs
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "swan=${{ github.event.inputs.build_swan }}" >> $GITHUB_OUTPUT
            echo "rompy=${{ github.event.inputs.build_rompy }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # For releases, build both
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "swan=true" >> $GITHUB_OUTPUT
            echo "rompy=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # For push/PR, check what changed
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          # Check if SWAN-related files changed
          if git diff --name-only "$BASE_SHA" HEAD | grep -E "(docker/swan\.Dockerfile|\.github/workflows/docker-build\.yml)" > /dev/null; then
            echo "swan=true" >> $GITHUB_OUTPUT
          else
            echo "swan=false" >> $GITHUB_OUTPUT
          fi

          # Check if Rompy-related files changed
          if git diff --name-only "$BASE_SHA" HEAD | grep -E "(docker/rompy\.Dockerfile|rompy_oceanum/|pyproject\.toml|\.github/workflows/docker-build\.yml)" > /dev/null; then
            echo "rompy=true" >> $GITHUB_OUTPUT
          else
            echo "rompy=false" >> $GITHUB_OUTPUT
          fi

  # Build SWAN Docker image
  build-swan:
    runs-on: ubuntu-latest
    needs: determine-builds
    if: needs.determine-builds.outputs.build_swan == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/swan
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=swan-{{date 'YYYYMMDD'}}-{{sha}}
          labels: |
            org.opencontainers.image.title=SWAN Wave Model
            org.opencontainers.image.description=SWAN wave model Docker image for rompy-oceanum
            org.opencontainers.image.vendor=rompy-oceanum

      - name: Build and push SWAN image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/swan.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Test SWAN image
        if: github.event_name == 'pull_request'
        run: |
          # Load the built image for testing
          docker buildx build --load -t test-swan:latest -f ./docker/swan.Dockerfile .

          # Test that SWAN executable is available
          docker run --rm test-swan:latest swan.exe --help || echo "SWAN help command completed"

          # Test that required libraries are installed
          docker run --rm test-swan:latest ldd /usr/local/bin/swan.exe

          echo "✅ SWAN image tests passed"

  # Build Rompy Docker image
  build-rompy:
    runs-on: ubuntu-latest
    needs: determine-builds
    if: needs.determine-builds.outputs.build_rompy == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/rompy
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=rompy-{{date 'YYYYMMDD'}}-{{sha}}
          labels: |
            org.opencontainers.image.title=Rompy-Oceanum
            org.opencontainers.image.description=Rompy with Oceanum Prax pipeline integration
            org.opencontainers.image.vendor=rompy-oceanum

      - name: Build and push Rompy image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/rompy.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Test Rompy image
        if: github.event_name == 'pull_request'
        run: |
          # Load the built image for testing
          docker buildx build --load -t test-rompy:latest -f ./docker/rompy.Dockerfile .

          # Test that Python packages are installed correctly
          docker run --rm test-rompy:latest python -c "import rompy; print(f'Rompy version: {rompy.__version__}')"
          docker run --rm test-rompy:latest python -c "import rompy_oceanum; print('rompy-oceanum imported successfully')"
          docker run --rm test-rompy:latest python -c "import oceanum; print('oceanum imported successfully')"

          # Test CLI tools
          docker run --rm test-rompy:latest rompy-oceanum --help
          docker run --rm test-rompy:latest oceanum --version || echo "oceanum CLI test completed"

          # Test that rompy can import the plugin
          docker run --rm test-rompy:latest python -c "
          import rompy
          from rompy_oceanum.pipeline import PraxPipelineBackend
          print('✅ Prax pipeline backend can be imported')
          "

          echo "✅ Rompy image tests passed"

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest
    needs: [determine-builds, build-swan, build-rompy]
    if: always() && (needs.build-swan.result == 'success' || needs.build-rompy.result == 'success')
    permissions:
      security-events: write
    strategy:
      matrix:
        image:
          - ${{ needs.determine-builds.outputs.build_swan == 'true' && format('{0}/{1}/swan', env.REGISTRY, env.IMAGE_NAME) || '' }}
          - ${{ needs.determine-builds.outputs.build_rompy == 'true' && format('{0}/{1}/rompy', env.REGISTRY, env.IMAGE_NAME) || '' }}
        exclude:
          - image: ''

  steps:
    - name: Run Trivy vulnerability scanner
      if: github.event_name != 'pull_request'
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ matrix.image }}:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      if: github.event_name != 'pull_request'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  # Summary job
  build-summary:
    runs-on: ubuntu-latest
    needs: [determine-builds, build-swan, build-rompy]
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.determine-builds.outputs.build_swan }}" = "true" ]; then
            if [ "${{ needs.build-swan.result }}" = "success" ]; then
              echo "✅ SWAN image build: **Success**" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ SWAN image build: **Failed**" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⏭️ SWAN image build: **Skipped** (no changes detected)" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.determine-builds.outputs.build_rompy }}" = "true" ]; then
            if [ "${{ needs.build-rompy.result }}" = "success" ]; then
              echo "✅ Rompy image build: **Success**" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ Rompy image build: **Failed**" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⏭️ Rompy image build: **Skipped** (no changes detected)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Tags" >> $GITHUB_STEP_SUMMARY
          echo "Images are tagged with:" >> $GITHUB_STEP_SUMMARY
          echo "- Branch name (for pushes)" >> $GITHUB_STEP_SUMMARY
          echo "- PR number (for pull requests)" >> $GITHUB_STEP_SUMMARY
          echo "- Semantic version (for releases)" >> $GITHUB_STEP_SUMMARY
          echo "- \`latest\` (for main/master branch)" >> $GITHUB_STEP_SUMMARY
          echo "- Date and SHA (for all builds)" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Registry" >> $GITHUB_STEP_SUMMARY
            echo "Images are available at: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          fi
